<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phong Hà Computer - Đang bảo trì</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #fff;
            overflow: hidden;
        }

        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            animation: float linear infinite;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) rotate(720deg);
                opacity: 0;
            }
        }

        .container {
            text-align: center;
            z-index: 1;
            padding: 40px 20px;
            max-width: 650px;
        }

        .icon-wrapper {
            margin-bottom: 30px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .gear-icon {
            width: 120px;
            height: 120px;
            margin: 0 auto;
            position: relative;
        }

        .gear-icon svg {
            width: 100%;
            height: 100%;
            fill: #ffd700;
            animation: spin 8s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 15px;
            background: linear-gradient(90deg, #ffd700, #ff6b35, #ffd700);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shine 3s linear infinite;
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        .subtitle {
            font-size: 1.2rem;
            color: #b8b8d4;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .progress-bar {
            width: 100%;
            max-width: 400px;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            margin: 0 auto 40px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 30%;
            background: linear-gradient(90deg, #ffd700, #ff6b35);
            border-radius: 3px;
            animation: loading 2s ease-in-out infinite;
        }

        @keyframes loading {
            0% { width: 0%; margin-left: 0; }
            50% { width: 60%; margin-left: 20%; }
            100% { width: 0%; margin-left: 100%; }
        }

        .info-cards {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 40px;
        }

        .info-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px 25px;
            backdrop-filter: blur(10px);
            transition: transform 0.3s, border-color 0.3s;
            min-width: 180px;
        }

        .info-card:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 215, 0, 0.3);
        }

        .info-card .card-icon {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .info-card .card-title {
            font-size: 0.85rem;
            color: #8888a8;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .info-card .card-value {
            font-size: 1.1rem;
            color: #e0e0f0;
        }

        .contact {
            color: #8888a8;
            font-size: 0.95rem;
        }

        .contact a {
            color: #ffd700;
            text-decoration: none;
            transition: color 0.3s;
        }

        .contact a:hover {
            color: #ff6b35;
        }

        .logo-text {
            font-size: 0.9rem;
            color: #555580;
            margin-top: 30px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 1.8rem;
            }

            .subtitle {
                font-size: 1rem;
            }

            .info-cards {
                flex-direction: column;
                align-items: center;
            }

            .info-card {
                width: 100%;
                max-width: 280px;
            }

            .gear-icon {
                width: 80px;
                height: 80px;
            }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>

    <div class="container">
        <div class="icon-wrapper">
            <div class="gear-icon">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 15.5A3.5 3.5 0 0 1 8.5 12 3.5 3.5 0 0 1 12 8.5a3.5 3.5 0 0 1 3.5 3.5 3.5 3.5 0 0 1-3.5 3.5m7.43-2.53c.04-.32.07-.64.07-.97s-.03-.66-.07-1l2.11-1.63c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.31-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.5.42l-.37 2.65c-.63.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64L4.57 11c-.04.34-.07.67-.07 1s.03.65.07.97l-2.11 1.66c-.19.15-.25.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1.01c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.25.42.5.42h4c.25 0 .46-.18.5-.42l.37-2.65c.63-.26 1.17-.59 1.69-.98l2.49 1.01c.22.08.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.66Z"/>
                </svg>
            </div>
        </div>

        <h1>Website Đang Bảo Trì</h1>

        <p class="subtitle">
            Chúng tôi đang nâng cấp hệ thống để mang đến trải nghiệm tốt hơn cho bạn.
            <br>Vui lòng quay lại sau ít phút.
        </p>

        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>

        <div class="info-cards">
            <div class="info-card">
                <div class="card-icon">&#128736;</div>
                <div class="card-title">Trạng thái</div>
                <div class="card-value">Đang nâng cấp</div>
            </div>
            <div class="info-card">
                <div class="card-icon">&#128222;</div>
                <div class="card-title">Hotline</div>
                <div class="card-value">
                    <a href="tel:0123456789" style="color: #e0e0f0; text-decoration: none;">07 86 92 6666</a>
                </div>
            </div>
            <div class="info-card">
                <div class="card-icon">&#128231;</div>
                <div class="card-title">Email</div>
                <div class="card-value">
                    <a href="mailto:phonghacomputer@gmail.com" style="color: #e0e0f0; text-decoration: none;">phonghacomputer@gmail.com</a>
                </div>
            </div>
        </div>

        <p class="contact">
            Cần hỗ trợ gấp? Liên hệ <a href="https://facebook.com/phonghacomputer" target="_blank">Facebook</a> hoặc gọi Hotline
        </p>

        <p class="logo-text">Phong Ha Computer</p>
    </div>

    <script>
        // Create floating particles
        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 50; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.animationDuration = (Math.random() * 10 + 5) + 's';
            particle.style.animationDelay = (Math.random() * 5) + 's';
            particle.style.width = (Math.random() * 4 + 2) + 'px';
            particle.style.height = particle.style.width;
            particlesContainer.appendChild(particle);
        }
    </script>
</body>
</html>
